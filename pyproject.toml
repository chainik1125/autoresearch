[project]
name = "autoresearch"
version = "0.1.0"
description = "Automated-research toolkit: dispatch user-defined pipelines onto cloud compute, persist findings, survive pod death."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Manning-Coe" }]

dependencies = [
    "anthropic>=0.40",
    "boto3>=1.35",
    "claude-agent-sdk>=0.1",   # headless CC for prep / mechanic / postflight agents
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tomli-w>=1.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoresearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
