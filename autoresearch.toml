# autoresearch project config — values here are read by pydantic-settings.
# Secrets (AWS_*, ANTHROPIC_API_KEY, RUNPOD_API_KEY, HF_TOKEN, CLOUDFLARE_API_FRA) come from env only.

# Tier 1 — structured state on Cloudflare R2 (S3-compatible).
storage = "s3"
storage_bucket = "fra-proj"
storage_endpoint_url = "https://1017e5793f988de0c543f206026b75b7.r2.cloudflarestorage.com"
storage_region = "auto"

# Tier 2 — compute.
compute = "runpod"
default_gpu = "H100 80GB"                      # H100 / A100-80GB fit Qwen-32B at fp16; A40 needs quantization
runpod_data_center = "US-CA-2"
runpod_network_volume_id = "l7wyka84iy"        # 1TB, autoresearch-fra (US-CA-2)
# Thin pod image: only third-party deps are baked in. The pod git-clones
# autoresearch source at boot (see docker/entrypoint.sh) so source changes
# ship by `git push main` + dispatching a new pod — no image rebuild.
# Pin a SHA tag here if you want to freeze the infra image alongside a
# specific deployment; otherwise `:latest` follows the most recent infra
# build (only triggered by Dockerfile / pyproject.toml / entrypoint changes).
runpod_default_image = "ghcr.io/chainik1125/autoresearch:latest"
runpod_container_registry_auth_id = "cmp2b493n0051ju07mlw41yu1"  # ghcr-autoresearch, points at GIT_PAT

# Where the user keeps their Pipeline classes (at the repo root).
pipeline_module_path = "pipelines"

# Pod entrypoint clones this onto the persistent volume on first boot so the
# runner has access to pipelines/. For our v1 test we use this repo itself.
project_repo_url = "https://github.com/chainik1125/autoresearch.git"

# Default budget for new runs (USD).
default_budget_usd = 5

# Validators — off until ANTHROPIC_API_KEY is configured.
preflight = false
postflight = false
summarize_errors = false
